# Example Helm values for yk-talos-management.
#
# Deploy with:
#   helm upgrade --install yk-talos-management ./charts/yk-talos-management \
#     --namespace yk-talos-management-system --create-namespace \
#     -f examples/helm/values.yaml
#
# Local development (custom registry, no webhooks):
#   helm upgrade --install yk-talos-management ./charts/yk-talos-management \
#     --namespace yk-talos-management-system --create-namespace \
#     -f examples/helm/values.yaml \
#     --set image.repository=localhost:5000/yk-talos-management \
#     --set image.tag=dev \
#     --set webhooks.enabled=false

image:
  repository: harbor-mgmt.yuriy-lab.cloud/dev/yk-talos-management
  tag: "dev"
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

ports:
  metrics: 8080
  health: 8081
  webhook: 9443

metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 8080

leaderElection:
  enabled: true
  id: yk-talos-management.lock

# Webhooks require TLS. cert-manager must be installed in the cluster.
# To use a different issuer, change issuerRef below.
webhooks:
  enabled: false
  certManager:
    enabled: true
    issuerRef:
      name: selfsigned-issuer
      kind: ClusterIssuer

# Pod-level security context — enforces non-root and a restricted seccomp profile.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container-level security context — drops all capabilities and locks down the filesystem.
# runAsUser must be numeric so Kubernetes can verify runAsNonRoot — distroless "nonroot" = UID 65532.
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

crds:
  install: true

nodeSelector: {}
tolerations: []
affinity: {}
