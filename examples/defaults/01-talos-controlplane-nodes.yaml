# Step 2a — Declare the control plane nodes.
#
# Apply after the TalosCluster reaches Ready.
# Wait for all nodes to reach status.phase=Ready before applying the bootstrap.
---
apiVersion: talos.yuriykovalchuk.dev/v1alpha1
kind: TalosNode
metadata:
  name: my-cluster-cp-1
  namespace: default
spec:
  clusterRef: my-cluster
  role: ControlPlane
  nodeIP: 172.22.0.3
  patches:
    - |
      machine:
        network:
          hostname: cp-1
        nodeLabels:
          mysuperlabel: control-node-1
---
apiVersion: talos.yuriykovalchuk.dev/v1alpha1
kind: TalosNode
metadata:
  name: my-cluster-cp-2
  namespace: default
spec:
  clusterRef: my-cluster
  role: ControlPlane
  nodeIP: 172.22.0.4
  patches:
    - |
      machine:
        network:
          hostname: cp-2
        nodeLabels:
          mysuperlabel: control-node-2
---
apiVersion: talos.yuriykovalchuk.dev/v1alpha1
kind: TalosNode
metadata:
  name: my-cluster-cp-3
  namespace: default
spec:
  clusterRef: my-cluster
  role: ControlPlane
  nodeIP: 172.22.0.5
  patches:
    - |
