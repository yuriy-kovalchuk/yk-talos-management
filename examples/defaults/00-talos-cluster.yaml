# Step 1 — Define the cluster.
#
# The controller generates four secrets in the same namespace:
#   <name>-secrets        JSON bundle of the cluster PKI (CA, tokens, keys)
#   <name>-controlplane   Machine config for control-plane nodes
#   <name>-worker         Machine config for worker nodes
#   <name>-talosconfig    Admin talosconfig for API client access
#
# Apply this first, wait for status.phase=Ready, then apply nodes.
apiVersion: talos.yuriykovalchuk.dev/v1alpha1
kind: TalosCluster
metadata:
  name: my-cluster
  namespace: default
spec:
  clusterName: my-cluster
  # List all control plane IPs.  The first is used as the Kubernetes API endpoint
  # (https://<endpoint>:6443); all are embedded in the talosconfig so any node
  # can be reached for Talos API calls and kubeconfig retrieval.
  endpoints:
    - 172.22.0.3
    - 172.22.0.4
    - 172.22.0.5
  # Must match the Talos release deployed on your nodes.
  talosVersion: v1.13
