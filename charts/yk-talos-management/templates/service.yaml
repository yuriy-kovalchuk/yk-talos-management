{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yk-talos-management.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yk-talos-management.labels" . | nindent 4 }}
spec:
  type: {{ .Values.metrics.service.type }}
  selector:
    {{- include "yk-talos-management.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
{{- if .Values.webhooks.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yk-talos-management.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yk-talos-management.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "yk-talos-management.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
      protocol: TCP
{{- end }}
