{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: talosclusters.talos.yuriykovalchuk.dev
spec:
  group: talos.yuriykovalchuk.dev
  names:
    kind: TalosCluster
    listKind: TalosClusterList
    plural: talosclusters
    shortNames:
    - taloscluster
    singular: taloscluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TalosCluster generates and stores the secrets bundle, machine
          configs, and talosconfig for a Talos Linux cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              clusterName:
                description: Name of the Talos cluster, embedded in generated machine
                  configs.
                type: string
              endpoints:
                description: |-
                  IP addresses of the control plane nodes. The first endpoint is used as the
                  Kubernetes API server address; all are embedded in the generated talosconfig.
                items:
                  type: string
                minItems: 1
                type: array
              kubernetesVersion:
                description: |-
                  Kubernetes version to embed in the generated machine configs (e.g. "1.32.1").
                  When unset, the Talos SDK's bundled default for the given Talos version is used.
                  Override this when you need to pin a specific Kubernetes minor version.
                type: string
              talosVersion:
                description: Talos version used when generating machine configs (e.g.
                  v1.13.0).
                type: string
            required:
            - clusterName
            - endpoints
            - talosVersion
            type: object
          status:
            properties:
              conditions:
                description: Current service state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastUpdateTime:
                description: Timestamp of the last successful reconcile.
                format: date-time
                type: string
              observedGeneration:
                description: Generation last observed by the controller.
                format: int64
                type: integer
              phase:
                description: Current lifecycle phase of the cluster.
                type: string
              retryCount:
                description: Number of consecutive failed reconcile attempts.
                format: int32
                minimum: 0
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
