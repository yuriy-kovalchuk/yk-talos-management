---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: talosnodes.talos.yuriykovalchuk.dev
spec:
  group: talos.yuriykovalchuk.dev
  names:
    kind: TalosNode
    listKind: TalosNodeList
    plural: talosnodes
    shortNames:
    - talosnode
    singular: talosnode
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TalosNode applies machine configuration to a single Talos Linux
          node and manages its lifecycle.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              clusterRef:
                description: Name of the TalosCluster this node belongs to.
                type: string
              drainTimeout:
                description: |-
                  Maximum time to wait for all pods to be evicted during node drain.
                  Defaults to 5 minutes.
                type: string
              driftDetection:
                default: true
                description: |-
                  When true, the controller periodically fetches the running config from the node
                  and re-applies if it diverges from the desired state. Set to false for nodes
                  that are frequently offline (e.g. homelab nodes powered down overnight).
                type: boolean
              nodeIP:
                description: IPv4 address of the Talos node.
                format: ipv4
                type: string
              patches:
                description: |-
                  YAML patches applied on top of the base machine config.
                  Patches without an apiVersion key are deep-merged into the machine/cluster config.
                  Patches with apiVersion (e.g. RegistryMirrorConfig) are appended as separate YAML documents.
                items:
                  type: string
                type: array
              patchesFrom:
                description: |-
                  Secret-backed patches applied after inline patches, so sensitive values
                  (credentials, keys) do not need to be inlined in the manifest.
                  Each entry references a key within a Kubernetes Secret in the same namespace.
                items:
                  description: SecretKeySelector selects a key of a Secret.
                  properties:
                    key:
                      description: The key of the secret to select from.  Must be
                        a valid secret key.
                      type: string
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                    optional:
                      description: Specify whether the Secret or its key must be defined
                      type: boolean
                  required:
                  - key
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              resetOnDelete:
                default: false
                description: |-
                  When true, the operator wipes the node's ephemeral state and reboots it into
                  maintenance mode as part of the deletion sequence (after etcd leave, before the
                  config secret is removed). Useful when the node hardware will be repurposed —
                  the next TalosNode pointing at the same IP will apply a fresh config.
                  Best-effort: a reset failure is logged and emits an event but never blocks deletion.
                type: boolean
              role:
                description: Role of this node in the cluster.
                enum:
                - ControlPlane
                - Worker
                type: string
              skipDrain:
                default: false
                description: |-
                  When true, skip Kubernetes node drain (cordon + pod eviction) during node removal.
                  Use for nodes that are already unreachable or when fast removal is required.
                type: boolean
              systemExtensions:
                description: |-
                  Talos system extensions to install on this node via the Talos Image Factory.
                  Extensions are hardware-specific — nodes in the same cluster can have different
                  extension sets. Changing this list triggers an upgrade to a new factory-built
                  image at the current (or newly specified) Talos version.
                  Extension names follow the format "siderolabs/<name>" (e.g. "siderolabs/iscsi-tools").
                items:
                  type: string
                type: array
              talosVersion:
                description: |-
                  Desired Talos OS version to run on this node (e.g. "v1.13.2").
                  When set and different from status.currentTalosVersion, the operator triggers
                  an in-place upgrade automatically. When spec.systemExtensions is also set,
                  the factory-built image for the current schematic is used so extensions are
                  preserved across version upgrades. Downgrades are rejected.
                type: string
            required:
            - clusterRef
            - nodeIP
            - role
            type: object
          status:
            properties:
              conditions:
                description: Current service state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentTalosVersion:
                description: |-
                  Talos version currently running on this node.
                  Populated after a successful upgrade via the talos.yuriykovalchuk.dev/upgrade annotation
                  or spec.talosVersion.
                type: string
              deletionAttempts:
                description: Number of failed etcd leave attempts during deletion.
                format: int32
                type: integer
              installedExtensions:
                description: |-
                  System extensions currently installed on the node.
                  Populated after a successful upgrade that included spec.systemExtensions.
                items:
                  type: string
                type: array
              lastUpdateTime:
                description: Timestamp of the last successful reconcile.
                format: date-time
                type: string
              message:
                description: Human-readable message describing the current state.
                type: string
              observedGeneration:
                description: Generation last observed by the controller.
                format: int64
                type: integer
              phase:
                description: Current lifecycle phase of the node.
                type: string
              retryCount:
                description: Number of consecutive failed reconcile attempts.
                format: int32
                minimum: 0
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
