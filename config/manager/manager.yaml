apiVersion: apps/v1
kind: Deployment
metadata:
  name: yk-talos-management
  namespace: yk-talos-management-system
  labels:
    app.kubernetes.io/name: yk-talos-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yk-talos-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yk-talos-management
    spec:
      serviceAccountName: yk-talos-management
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/yuriy-kovalchuk/yk-talos-management:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --zap-log-level=1
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DISABLE_WEBHOOKS
              value: "true"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
